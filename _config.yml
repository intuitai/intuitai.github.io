# Jekyll configuration for intuitai.org.
#
# The domain is one small site, rendered end to end through the jekyll-gitbook
# remote theme:
#
#   /                                the IntuitAI landing page
#   /ml-powered-text-recovery.html   a research write-up
#
# It used to host two books as well, at /ep/ and /eai/, each with its own
# collections, generated pages and JSON-LD branch. Those were removed in August
# 2026 when the organization was repositioned as a venture studio; the books
# moved out of this repository entirely. If you are reading a comment elsewhere
# that mentions /ep/ or /eai/, it is stale -- say so or delete it.
#
# Files WITHOUT front matter are still copied through byte-for-byte -- img/,
# resource/, styles/ and robots.txt rely on it.
#
# baseurl is empty and must stay that way. intuitai.org is an apex custom
# domain served from the root, and a remote theme's assets are copied into
# _site/assets with every stylesheet link the theme emits prefixed by baseurl,
# so a non-empty value would send the CSS requests somewhere that 404s.

title:      IntuitAI
longtitle:  "IntuitAI — Agentic AI Venture Studio"
author:     Dr. Nobel Khandaker
email:      nobel@outlook.com
# Kept under 160 characters on purpose. This is the fallback for every page's
# meta/OG/Twitter description, and _includes/head.html truncates at 300 -- but
# search engines cut a description around 155-160, so anything longer is
# written for nobody. A 358-character version of this line rendered on the
# homepage ending mid-word in "implementa...".
description: >
  A research-driven venture studio incubating agentic and multi-agent AI
  startups, building the reliability layer autonomous systems are missing.

url:      "https://intuitai.org"
baseurl:  ""

# Default share image and favicon, both consumed by the _includes/head.html
# override. A page overrides the image with `image:` in its front matter.
#
# The dimensions are declared because the logo is SQUARE (512x512). Twitter's
# summary_large_image card is built for a 2:1 image and letterboxes or crops a
# square one, so head.html defaults to the plain `summary` card and a page with
# a genuinely wide image opts in with `twitter_card: summary_large_image`.
image:        /img/neural.png
image_width:  512
image_height: 512
image_type:   image/png
favicon_path: img/neural.png

# Emitted by _includes/head.html, and only when JEKYLL_ENV=production, so a
# local `jekyll serve` never reports traffic into the real property.
google_analytics: G-KB7KB9JGJB

remote_theme: sighingnow/jekyll-gitbook

# The theme labels the first sidebar entry with site.title and links it to the
# site root, which here is the landing page.

# In-page contents, rendered into the sidebar under the active page.
toc:
  enabled: true
  h_min: 2
  h_max: 2

page_width: 900px

markdown: kramdown
kramdown:
  auto_ids:           true
  input:              GFM
  smart_quotes:       lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang:     python

syntax_highlighter_style: colorful

# Relative to the site root and without a leading slash -- the theme prefixes
# baseurl itself for any value that is not an absolute URL.
#
# Deliberately NOT under assets/: jekyll-remote-theme copies the theme's own
# assets/ tree into _site/assets/, and mixing site files into that tree is
# exactly the collision this file warns about above. The path was
# ep/assets/css/site.css until the books were removed.
extra_css:
  - styles/site.css

collections:
  # Research write-ups. A collection rather than loose root pages so the theme's
  # sidebar has something to list: toc-date.html walks `ordered_collections` and
  # prints each page's title, and with no collection at all the sidebar renders
  # as a single orphaned link back to the site root.
  #
  # Each page sets its own `permalink` in front matter, which overrides the one
  # below. /ml-powered-text-recovery.html keeps its original URL that way --
  # outside links already point at it and there is nothing to gain by moving it.
  research:
    output: true
    permalink: /research/:path/
    sort_by: order

# Drives the sidebar, in this order. The theme prints every page's TITLE as a
# flat list item and separates one collection from the next with a
# `<li class="divider">`; the collection's own name is never shown, so a page
# title has to stand on its own in that column.
ordered_collections:
  - research

# The theme generates assets/search.html, and it is the one page on the domain
# nobody should ever arrive at from a search engine: it is a search box with a
# JSON index, it inherits the site title and the site description verbatim, and
# left alone it went into the sitemap advertising itself as `index, follow`
# with a self-canonical -- a duplicate of the homepage's metadata on a page
# with no content.
#
# `sitemap: false` is read by jekyll-sitemap; `noindex` is our own flag, read
# by the _includes/head.html override. Scoping `defaults` at the theme's page
# works because a remote theme's pages are ordinary site pages by the time
# defaults are applied.
defaults:
  - scope: { path: "assets/search.html" }
    values:
      sitemap: false
      noindex: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - CLAUDE.md
  - LICENSE
  - .github
  - .claude
  # The Markdown draft the research page was written from. It has no front
  # matter, so it would otherwise be copied through and served verbatim at
  # /ml-powered-text-recovery.md -- a near-duplicate of the rendered page,
  # unreferenced and absent from the sitemap, but reachable and indexable.
  # Kept in the repository, no longer published.
  - ml-powered-text-recovery.md

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jemoji
