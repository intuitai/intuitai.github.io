# Jekyll configuration for intuitai.org.
#
# The domain hosts two things that share a hostname and, since July 2026, a
# theme as well:
#
#   /      the IntuitAI landing page and its project pages
#   /ep/   "Everyday Programming", a book site
#
# Both now render through the jekyll-gitbook remote theme. This is a change:
# the landing page and ml-powered-text-recovery.html used to be hand-written
# Pico.css files with no front matter, which made Jekyll copy them through
# byte-for-byte, and the book was the only themed part of the domain. They now
# carry front matter and `layout: post`, so they get the theme's chrome and the
# book's sidebar. Pico.css is no longer used anywhere on the site.
#
# Files WITHOUT front matter are still copied through untouched -- img/,
# resource/, ep/assets/ and robots.txt rely on it.
#
# baseurl is empty, not "/ep". Setting it to "/ep" is the obvious-looking move
# and it breaks the theme: a remote theme's assets are copied to _site/assets,
# and every stylesheet link the theme emits is prefixed with baseurl, so the CSS
# would be requested from /ep/assets/gitbook/ and 404. The book's location lives
# in the permalinks instead -- see tools/extract_exercises.py --prefix.

title:      IntuitAI
longtitle:  "Everyday Programming: Basics of Computer Programs"
author:     Dr. Nobel Khandaker
email:      nobel@outlook.com
description: >
  IntuitAI is a non-profit research organization building open-source, practical
  AI tools. It also publishes Everyday Programming, a first book on programming
  for absolute beginners.

url:      "https://intuitai.org"
baseurl:  ""

# Default share image and favicon, both consumed by the _includes/head.html
# override. A page overrides the image with `image:` in its front matter -- the
# book's pages point at the cover instead (see `defaults` below).
image:        /img/neural.png
favicon_path: img/neural.png

# Emitted by _includes/head.html, and only when JEKYLL_ENV=production, so a
# local `jekyll serve` never reports traffic into the real property.
google_analytics: G-KB7KB9JGJB

remote_theme: sighingnow/jekyll-gitbook

# The theme labels the first sidebar entry with site.title and links it to the
# site root, which here is the IntuitAI landing page rather than the book. That
# is why site.title is "IntuitAI" and not the book's name: the entry then reads
# as what it actually is, a way back out to the parent site. The book's own home
# page is the first entry in the `book` collection below.

# In-page contents, rendered into the sidebar under the active page. Held to
# level 2 on purpose: exercise pages carry an h3 per exercise, and Chapter 20
# alone has 130 of them -- listing those would bury the navigation.
toc:
  enabled: true
  h_min: 2
  h_max: 2

page_width: 900px

markdown: kramdown
kramdown:
  auto_ids:           true
  input:              GFM
  smart_quotes:       lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang:     python

syntax_highlighter_style: colorful

# Relative to the site root and without a leading slash -- the theme prefixes
# baseurl itself for any value that is not an absolute URL.
extra_css:
  - ep/assets/css/site.css

collections:
  # The book's own pages: the pitch, the contents, the sample, the errata.
  book:
    output: true
    permalink: /ep/book/:path/
    sort_by: order
  # One page per chapter that carries Find the Bug exercises.
  exercises:
    output: true
    permalink: /ep/exercises/:path/
    sort_by: order
  # Worked solutions, one page per chapter. Deliberately absent from
  # ordered_collections below: the pages are built and linked from each
  # exercise, but listing all twelve again in the sidebar would double the
  # navigation and invite readers past the exercises they came for.
  solutions:
    output: true
    permalink: /ep/solutions/:path/
    sort_by: order

ordered_collections:
  - book
  - exercises

# Link previews for anything under /ep should show the book's cover rather than
# the IntuitAI logo. Set per collection because Jekyll's `defaults` match on
# scope, and the three book collections are the only things at that path.
defaults:
  - scope: { path: "", type: "book" }
    values: { image: /ep/assets/img/cover.png, image_alt: "Cover of Everyday Programming, Volume I: Basics of Computer Programs" }
  - scope: { path: "", type: "exercises" }
    values: { image: /ep/assets/img/cover.png, image_alt: "Cover of Everyday Programming, Volume I: Basics of Computer Programs" }
  - scope: { path: "", type: "solutions" }
    values: { image: /ep/assets/img/cover.png, image_alt: "Cover of Everyday Programming, Volume I: Basics of Computer Programs" }

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - README.md
  - CLAUDE.md
  - LICENSE
  - .github
  - .claude
  # The Markdown draft the project page was written from. It has no front
  # matter, so it used to be copied through and served verbatim at
  # /ml-powered-text-recovery.md -- a near-duplicate of the rendered page,
  # unreferenced and absent from the sitemap, but reachable and indexable.
  # Kept in the repository, no longer published.
  - ml-powered-text-recovery.md

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jemoji
